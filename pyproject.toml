[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hulhe-ucv-escher"
version = "0.4.0"
description = "UCV-ESCHER for heads-up fixed-limit Hold'em against Fell Omen 2"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==1.26.4", "open_spiel==1.6.3", "scipy==1.13.1", "torch==2.7.0",
]

[project.optional-dependencies]
parallel = ["ray==2.51.2", "psutil==7.2.1"]
dev = ["pytest>=8,<9"]

[project.scripts]
hulhe-train = "hulhe_escher.train:main"
hulhe-evaluate = "hulhe_escher.evaluate:main"
hulhe-fo2-setup = "hulhe_escher.fo2_setup:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hulhe_escher*", "unbiased_escher*", "adaptive_escher*", "vr_deep_cfr*"]

[tool.setuptools.package-data]
hulhe_escher = ["data/*.json", "java/*.java"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ray: real local Ray actors (opt-in via RUN_RAY_TESTS=1)", "fo2: real Fell Omen 2 bridge (opt-in via RUN_FO2_TESTS=1)"]
